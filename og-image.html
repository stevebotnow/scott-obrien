<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1200px; height: 630px;
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0A0E1A;
    color: #FFFFFF;
    display: flex; flex-direction: column; justify-content: center;
    padding: 72px 80px;
    position: relative; overflow: hidden;
  }
  .glow {
    position: absolute; top: -220px; right: -160px;
    width: 620px; height: 620px; border-radius: 50%;
    background: radial-gradient(circle, rgba(37,99,235,0.42) 0%, rgba(37,99,235,0) 68%);
  }
  .glow2 {
    position: absolute; bottom: -260px; left: -180px;
    width: 560px; height: 560px; border-radius: 50%;
    background: radial-gradient(circle, rgba(37,99,235,0.16) 0%, rgba(37,99,235,0) 70%);
  }
  .content { position: relative; z-index: 2; margin-top: 24px; }
  .eyebrow {
    display: inline-block; font-size: 19px; font-weight: 600; letter-spacing: 0.12em;
    text-transform: uppercase; color: #93B4F7; margin-bottom: 30px;
  }
  h1 { font-size: 86px; font-weight: 800; line-height: 1.02; letter-spacing: -0.04em; margin-bottom: 26px; }
  .lede { font-size: 32px; font-weight: 400; line-height: 1.42; color: #B8C2D6; max-width: 880px; }
  .accent { color: #4F8AF7; }
  .footer { position: relative; z-index: 2; display: flex; align-items: center; gap: 18px; position: absolute; left: 80px; bottom: 72px; }
  .bar { width: 76px; height: 7px; border-radius: 4px; background: #2563EB; }
  .domain { font-size: 26px; font-weight: 500; color: #8A97AE; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="glow2"></div>
  <div class="content">
    <span class="eyebrow">AI Engineer</span>
    <h1>Scott <span class="accent">O'Brien</span></h1>
    <p class="lede">I build tools that fix how work gets done. Some of them use AI.</p>
  </div>
  <div class="footer">
    <div class="bar"></div>
    <span class="domain">scott-obrien.com</span>
  </div>
</body>
</html>
